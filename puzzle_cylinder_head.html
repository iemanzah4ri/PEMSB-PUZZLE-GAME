<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cylinder Head Puzzle</title>
<style>

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }

html, body{
    margin:0; padding:0; width:100%; height:100%;
    position:fixed; overflow:hidden; overscroll-behavior:none;
    background:#123310; font-family:Arial, sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none;
    color:#f3ead0;
}

#bgGlow{
    position:fixed; inset:0;
    background-image:
        radial-gradient(circle at 20% 15%, rgba(0,224,140,0.22) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(0,224,140,0.22) 0%, transparent 50%),
        linear-gradient(rgba(6,14,5,0.72), rgba(4,9,3,0.92)),
        url(theme_bg.jpg);
    background-position: center, center, center, center;
    background-size: auto, auto, auto, cover;
    background-repeat: no-repeat, no-repeat, no-repeat, no-repeat;
    z-index:0;
}

/* ============ START SCREEN ============ */

#startScreen{
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:20px; text-align:center;
}

#startThumbWrap{
    width:min(260px, 34vh, 60vw);
    border-radius:10px;
    border:3px solid #00e08c;
    box-shadow:0 0 30px rgba(0,224,140,0.18);
    overflow:hidden;
    background:#2a1c10;
}
#startThumbWrap img{ width:100%; display:block; }

#startEyebrow{
    color:#00e08c; font-size:13px; font-weight:700;
    letter-spacing:4px; text-shadow:1px 1px 3px black;
}

#startTitle{
    margin:2px 0 4px 0;
    font-size:clamp(24px,4vw,38px);
    font-weight:900; letter-spacing:1px;
    text-shadow:0 2px 12px rgba(0,224,140,0.18);
}

#startSub{
    color:#e8dfc0; font-size:14px; max-width:420px; line-height:1.5em;
}

.woodPanel{
    background:linear-gradient(180deg, #6b4a2e, #3a2414);
    border:4px solid #2a1c10;
    border-radius:14px;
    padding:20px 26px 24px 26px;
    box-shadow:0 8px 24px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.12);
    display:flex; flex-direction:column; align-items:center; gap:10px;
}

#difficultyRow{
    display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:6px;
}

.diffBtn{
    width:130px; height:74px;
    border:2px solid #00e08c;
    border-radius:10px;
    background:rgba(58,36,20,0.78);
    color:#f3ead0;
    font-size:15px; font-weight:800;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    touch-action:none;
}
.diffBtn small{ font-weight:600; font-size:11px; color:#e0c98a; }
.diffBtn.selected, .diffBtn:active{
    background:#00e08c; color:#06210f;
}
.diffBtn.selected small{ color:#123; }

#bestTimes{
    font-size:12px; color:#c9b98a; margin-top:2px; min-height:16px;
}

#startBtn{
    margin-top:10px; width:240px; height:62px;
    border:none; border-radius:10px;
    background:#00e08c; color:#06210f;
    font-size:20px; font-weight:900; cursor:pointer;
    box-shadow:0 4px 0 #007b4d;
    touch-action:none;
}
#startBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #007b4d; }
#startBtn:disabled{ opacity:0.45; cursor:default; transform:none; box-shadow:0 4px 0 #007b4d; }

/* ============ HUD ============ */

#hud{
    position:fixed; top:12px; left:12px; right:12px;
    z-index:20;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none;
}

#hudLeft, #hudRight{
    display:flex; gap:8px; flex-wrap:wrap;
    pointer-events:auto;
}

.hudChip{
    background:rgba(58,36,20,0.75);
    border:2px solid #00e08c;
    border-radius:10px;
    padding:8px 12px;
    font-size:13px; font-weight:700;
    white-space:nowrap;
}
.hudChip .k{ color:#00e08c; margin-right:4px; }

.iconBtn{
    width:42px; height:42px;
    border-radius:10px;
    border:2px solid #00e08c;
    background:rgba(58,36,20,0.75);
    color:#f3ead0;
    font-size:18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    touch-action:none;
}
.iconBtn:active{ background:#00e08c; color:#06210f; }

/* ============ PREVIEW THUMB ============ */

#previewThumb{
    position:fixed;
    bottom:14px; left:14px;
    z-index:20;
    width:120px;
    border:2px solid #00e08c;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 16px rgba(0,0,0,0.5);
    background:#2a1c10;
    transition:opacity 0.2s;
}
#previewThumb img{ width:100%; display:block; }
#previewThumb.hidden{ opacity:0; pointer-events:none; }

/* ============ BOARD / TRAY ============ */

#gameScreen{ display:none; position:relative; z-index:10; width:100%; height:100%; }
#gameScreen.show{ display:block; }

#board{
    position:absolute;
    background-color:rgba(10,22,8,0.55);
    border:2px dashed rgba(0,224,140,0.35);
    border-radius:4px;
}

.slotLine{
    position:absolute;
    background:rgba(255,255,255,0.06);
}

.piece{
    position:absolute;
    background-repeat:no-repeat;
    border-radius:3px;
    box-shadow:0 3px 10px rgba(0,0,0,0.55);
    cursor:grab;
    touch-action:none;
    outline:2px solid rgba(255,255,255,0.18);
    outline-offset:-1px;
}
.piece.dragging{
    cursor:grabbing;
    z-index:500;
    box-shadow:0 10px 26px rgba(0,0,0,0.7);
    outline:2px solid #00e08c;
    filter:brightness(1.08);
}
.piece.placed{
    outline:2px solid rgba(0,255,140,0.55);
    box-shadow:0 1px 4px rgba(0,0,0,0.3);
    cursor:default;
}

#dragLayer{
    position:fixed; inset:0;
    z-index:15;
}

/* ============ WIN OVERLAY ============ */

#winOverlay{
    display:none;
    position:fixed; inset:0; z-index:200;
    background:rgba(0,0,0,0.82);
    align-items:center; justify-content:center;
    flex-direction:column; gap:12px; text-align:center; padding:20px;
}
#winOverlay.show{ display:flex; }

#winPanel{
    background:rgba(48,30,18,0.92);
    border:2px solid #00e08c;
    border-radius:14px;
    padding:26px 34px;
    max-width:92vw;
    box-shadow:0 0 0 4px #2a1c10, 0 0 40px rgba(0,224,140,0.25), 0 10px 30px rgba(0,0,0,0.5);
}

#winTitle{
    font-size:clamp(22px,3.5vw,34px);
    font-weight:900;
    color:#00e08c;
    text-shadow:0 2px 10px rgba(0,224,140,0.18);
    margin:0 0 6px 0;
}

#winStats{ font-size:15px; color:#f3ead0; margin:4px 0 14px 0; line-height:1.6em; }
#winStats .k{ color:#00e08c; font-weight:700; }

.winBtnRow{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

.winBtn{
    width:180px; height:56px;
    border:none; border-radius:10px;
    font-size:16px; font-weight:800; cursor:pointer;
    touch-action:none;
}
.winBtn.primary{ background:#00e08c; color:#06210f; box-shadow:0 4px 0 #007b4d; }
.winBtn.secondary{ background:#6b5238; color:#f3ead0; box-shadow:0 4px 0 #2a1c10; }.winBtn.tertiary{ background:linear-gradient(180deg,#5c86b8,#3a5f8a); color:#f3ead0; box-shadow:0 4px 0 #1c2c3f; }.winBtn:active{ transform:translateY(3px); box-shadow:none; }

canvas#confetti{ position:fixed; inset:0; z-index:190; pointer-events:none; }

@media (max-width:600px){
    .hudChip{ font-size:11px; padding:6px 9px; }
    #previewThumb{ width:86px; bottom:8px; left:8px; }
}

</style>
</head>
<body>

<div id="bgGlow"></div>
<canvas id="confetti"></canvas>

<!-- START SCREEN -->
<div id="startScreen">
    <div id="startThumbWrap"><img src="Picture5.png" alt="CYLINDER HEAD"></div>
    <div id="startEyebrow">PERODUA PUZZLE GAME · COMPONENT ID</div>
    <h1 id="startTitle">Cylinder Head Puzzle</h1>
    <div id="startSub">Reassemble the CYLINDER HEAD by dragging every piece back into place. Pick a difficulty to begin — background sound plays once you start.</div>

    <div class="woodPanel">
        <div id="difficultyRow">
            <button class="diffBtn" data-pieces="9">EASY<small>9 pieces</small></button>
            <button class="diffBtn selected" data-pieces="16">MEDIUM<small>16 pieces</small></button>
            <button class="diffBtn" data-pieces="25">HARD<small>25 pieces</small></button>
        </div>

        <div id="bestTimes"></div>

        <button id="startBtn" disabled>LOADING…</button>
    </div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen">
    <div id="hud">
        <div id="hudLeft">
            <div class="hudChip"><span class="k">MOVES</span><span id="movesVal">0</span></div>
            <div class="hudChip"><span class="k">TIME</span><span id="timeVal">0:00</span></div>
            <div class="hudChip"><span class="k">PLACED</span><span id="placedVal">0/0</span></div>
        </div>
        <div id="hudRight">
            <button class="iconBtn" id="previewToggleBtn" title="Toggle preview">👁</button>
            <button class="iconBtn" id="muteBtn" title="Mute">🔊</button>
            <button class="iconBtn" id="restartBtn" title="Restart">↺</button>
            <button class="iconBtn" id="menuBtn" title="Menu">🏠</button>
        </div>
    </div>

    <div id="previewThumb"><img src="Picture5.png" alt="CYLINDER HEAD"></div>

    <div id="board"></div>
    <div id="dragLayer"></div>
</div>

<!-- WIN OVERLAY -->
<div id="winOverlay">
    <div id="winPanel">
        <div id="winTitle">✅ CYLINDER HEAD ASSEMBLED!</div>
        <div id="winStats">
            <div><span class="k">Time</span> <span id="finalTime">0:00</span></div>
            <div><span class="k">Moves</span> <span id="finalMoves">0</span></div>
            <div><span class="k">Best Time</span> <span id="finalBest">—</span></div>
        </div>
        <div class="winBtnRow">
            <button class="winBtn primary" id="playAgainBtn">PLAY AGAIN</button>
            <button class="winBtn secondary" id="changeDiffBtn">CHANGE DIFFICULTY</button>
            <button class="winBtn tertiary" id="mainMenuBtn">MAIN MENU</button>
        </div>
    </div>
</div>

<script>

const PART_NAME = "CYLINDER HEAD";
const IMG_SRC = "Picture5.png";
const STORAGE_KEY = "puzzleBest_" + IMG_SRC;

/* =====================
   TOUCH / KIOSK GUARDS
===================== */

document.addEventListener("gesturestart", e=>e.preventDefault());
document.addEventListener("gesturechange", e=>e.preventDefault());
document.addEventListener("contextmenu", e=>e.preventDefault());

let lastTouchEnd = 0;
document.addEventListener("touchend", (e)=>{
    const now = Date.now();
    if(now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
}, {passive:false});

document.addEventListener("touchmove", (e)=>{
    if(!e.target.closest(".piece")) e.preventDefault();
}, {passive:false});

/* =====================
   AUDIO (fully synthesized, no external files)
===================== */

let audioCtx = null;
let musicGain = null;
let arpInterval = null;
let muted = localStorage.getItem("perodua_muted") === "true";
let soundtrack = null;
let soundtrackStarted = false;

function initAudio(){
    if(audioCtx) return;
    try{
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startAmbientMusic();
    }catch(e){ console.warn("Audio unavailable:", e); }
}

function initSoundtrack(){
    if(soundtrack) return;
    soundtrack = new Audio("soundtrack.mp3");
    soundtrack.loop = true;
    soundtrack.preload = "auto";
    soundtrack.volume = 0.45;
    soundtrack.muted = muted;
    window.__soundtrackPlayer = soundtrack;
    soundtrack.addEventListener("error", () => {
        console.warn("Background soundtrack failed to load.");
    });
}

function resumeSoundtrackPlayback(){
    if(!soundtrack || muted) return;
    const playPromise = soundtrack.play();
    if(playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(() => {
            setTimeout(() => {
                if(!muted && soundtrack) {
                    soundtrack.play().catch(() => {});
                }
            }, 200);
        });
    }
}

function updateSoundtrackState(){
    if(!soundtrack) return;
    soundtrack.muted = muted;
    if(muted){
        soundtrack.pause();
        return;
    }
    if(soundtrackStarted){
        resumeSoundtrackPlayback();
    }
}

function setSoundtrackSessionState(isPlaying){
    sessionStorage.setItem("perodua_soundtrack_playing", isPlaying ? "true" : "false");
}

function startBackgroundMusic(){
    initSoundtrack();
    soundtrackStarted = true;
    setSoundtrackSessionState(!muted);
    updateSoundtrackState();
}

function restoreBackgroundMusicIfNeeded(){
    const shouldPlay = sessionStorage.getItem("perodua_soundtrack_playing") === "true" && localStorage.getItem("perodua_muted") !== "true";
    if(shouldPlay){
        initSoundtrack();
        soundtrackStarted = true;
        resumeSoundtrackPlayback();
    }
}

function startAmbientMusic(){
    if(!audioCtx) return;

    musicGain = audioCtx.createGain();
    musicGain.gain.value = muted ? 0 : 0.05;
    musicGain.connect(audioCtx.destination);

    [110, 165, 220].forEach((freq)=>{
        const osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.value = freq;
        const g = audioCtx.createGain();
        g.gain.value = 0.4;
        osc.connect(g).connect(musicGain);
        osc.start();
    });

    const scale = [0,3,5,7,10]; // minor pentatonic-ish, factory/industrial mood
    let step = 0;
    arpInterval = setInterval(()=>{
        if(muted || !audioCtx) return;
        const semis = scale[step % scale.length];
        const freq = 196 * Math.pow(2, semis/12);
        playTone(freq, 0.6, 0.025, "triangle");
        step++;
    }, 950);
}

function playTone(freq, duration, vol, type){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.value = 0;
    osc.connect(g).connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    g.gain.linearRampToValueAtTime(vol, now+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, now+duration);
    osc.start(now);
    osc.stop(now+duration+0.05);
}

function playPickup(){ playTone(520, 0.07, 0.05, "square"); }
function playCorrect(){
    playTone(660, 0.12, 0.08, "sine");
    setTimeout(()=>playTone(990, 0.16, 0.06, "sine"), 90);
}
function playWrongDrop(){ playTone(140, 0.14, 0.05, "sawtooth"); }
function playVictory(){
    [523,659,784,1046,1318].forEach((f,i)=>{
        setTimeout(()=>playTone(f, 0.35, 0.08, "triangle"), i*130);
    });
}

document.getElementById("muteBtn").innerText = muted ? "🔇" : "🔊";
document.getElementById("muteBtn").addEventListener("click", ()=>{
    muted = !muted;
    localStorage.setItem("perodua_muted", muted ? "true" : "false");
    if(musicGain) musicGain.gain.value = muted ? 0 : 0.05;
    setSoundtrackSessionState(!muted);
    updateSoundtrackState();
    document.getElementById("muteBtn").innerText = muted ? "🔇" : "🔊";
});

document.getElementById("menuBtn").addEventListener("click", ()=>{
    window.location.href = "index.html";
});

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(error => {
            console.warn("Service worker registration failed:", error);
        });
    });
}

/* =====================
   DIFFICULTY SELECTION
===================== */

let targetPieces = 16;

const urlParams = new URLSearchParams(window.location.search);
const urlDiff = urlParams.get("diff");
const urlAuto = urlParams.get("auto");
if(urlDiff){
    const parsedDiff = parseInt(urlDiff, 10);
    if([9,16,25].includes(parsedDiff)){
        targetPieces = parsedDiff;
        document.querySelectorAll(".diffBtn").forEach(b=>{
            b.classList.toggle("selected", parseInt(b.dataset.pieces,10)===targetPieces);
        });
    }
}

document.querySelectorAll(".diffBtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
        document.querySelectorAll(".diffBtn").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
        targetPieces = parseInt(btn.dataset.pieces, 10);
    });
});

function showBestTimes(){
    const best = localStorage.getItem(STORAGE_KEY + "_" + targetPieces);
    document.getElementById("bestTimes").innerText = best ? ("Best time at this difficulty: " + best) : "";
}
showBestTimes();
document.querySelectorAll(".diffBtn").forEach(btn=>{
    btn.addEventListener("click", showBestTimes);
});

/* =====================
   PUZZLE STATE
===================== */

const img = new Image();
img.src = IMG_SRC;

let cols, rows, pieceW, pieceH;
let boardRect = {x:0,y:0,w:0,h:0};
let pieces = []; // {row,col,el,placed,x,y}
let placedCount = 0;
let moves = 0;
let startTime = 0;
let timerInterval = null;
let dragState = null;

function computeGrid(target, aspect){
    let rows = Math.max(2, Math.round(Math.sqrt(target/aspect)));
    let cols = Math.max(2, Math.round(target/rows));
    return {cols, rows};
}

function layout(){
    const vw = window.innerWidth, vh = window.innerHeight;
    const aspect = img.naturalWidth / img.naturalHeight;

    const maxW = vw * (vw<700 ? 0.92 : 0.62);
    const maxH = vh * 0.7;

    let w = maxW, h = w/aspect;
    if(h > maxH){ h = maxH; w = h*aspect; }

    boardRect.w = w; boardRect.h = h;
    boardRect.x = vw<700 ? (vw-w)/2 : vw*0.06;
    boardRect.y = vh/2 - h/2 - (vw<700 ? 40 : 0);

    pieceW = boardRect.w / cols;
    pieceH = boardRect.h / rows;

    const board = document.getElementById("board");
    board.style.left = boardRect.x+"px";
    board.style.top = boardRect.y+"px";
    board.style.width = boardRect.w+"px";
    board.style.height = boardRect.h+"px";

    drawSlotLines();
    layoutTray();

    pieces.forEach(p=>{
        if(p.placed) positionPieceAtSlot(p, true);
    });
}
window.addEventListener("resize", layout);
window.addEventListener("orientationchange", ()=>setTimeout(layout,300));

function drawSlotLines(){
    const board = document.getElementById("board");
    board.querySelectorAll(".slotLine").forEach(el=>el.remove());
    for(let c=1;c<cols;c++){
        const line = document.createElement("div");
        line.className="slotLine";
        line.style.left=(c*pieceW)+"px"; line.style.top="0px";
        line.style.width="1px"; line.style.height="100%";
        board.appendChild(line);
    }
    for(let r=1;r<rows;r++){
        const line = document.createElement("div");
        line.className="slotLine";
        line.style.left="0px"; line.style.top=(r*pieceH)+"px";
        line.style.width="100%"; line.style.height="1px";
        board.appendChild(line);
    }
}

function trayRect(){
    const vw = window.innerWidth, vh = window.innerHeight;
    if(vw < 700){
        return {x:10, y:boardRect.y+boardRect.h+14, w:vw-20, h:vh-(boardRect.y+boardRect.h+14)-10};
    }
    return {x: boardRect.x+boardRect.w+24, y:90, w: vw-(boardRect.x+boardRect.w+24)-20, h: vh-110};
}

function layoutTray(){
    const tr = trayRect();
    const unplaced = pieces.filter(p=>!p.placed);
    const gap = 8;
    let x = tr.x, y = tr.y;
    let rowH = 0;
    unplaced.forEach(p=>{
        if(x + pieceW > tr.x+tr.w){
            x = tr.x; y += rowH + gap; rowH = 0;
        }
        p.trayX = x; p.trayY = y;
        if(!dragState || dragState.piece!==p){
            setPiecePos(p, x, y);
        }
        x += pieceW + gap;
        rowH = Math.max(rowH, pieceH);
    });
}

function setPiecePos(p, x, y){
    p.x = x; p.y = y;
    p.el.style.left = x+"px";
    p.el.style.top = y+"px";
}

function positionPieceAtSlot(p, instant){
    const x = boardRect.x + p.col*pieceW;
    const y = boardRect.y + p.row*pieceH;
    setPiecePos(p, x, y);
}

function buildPuzzle(){
    document.getElementById("board").innerHTML = "";
    document.getElementById("dragLayer").innerHTML = "";
    pieces = [];
    placedCount = 0;
    moves = 0;
    document.getElementById("movesVal").innerText = "0";

    const grid = computeGrid(targetPieces, img.naturalWidth/img.naturalHeight);
    cols = grid.cols; rows = grid.rows;
    document.getElementById("placedVal").innerText = "0/"+(cols*rows);

    layout(); // sets pieceW/pieceH based on cols/rows

    const dragLayer = document.getElementById("dragLayer");

    for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){
            const el = document.createElement("div");
            el.className = "piece";
            el.style.width = pieceW+"px";
            el.style.height = pieceH+"px";
            el.style.backgroundImage = "url("+IMG_SRC+")";
            el.style.backgroundSize = (pieceW*cols)+"px "+(pieceH*rows)+"px";
            el.style.backgroundPosition = (-c*pieceW)+"px "+(-r*pieceH)+"px";

            const piece = {row:r, col:c, el, placed:false, x:0, y:0};
            el.addEventListener("pointerdown", (e)=>onPieceDown(e, piece));
            dragLayer.appendChild(el);
            pieces.push(piece);
        }
    }

    shufflePieces();
    layoutTray();

    startTime = Date.now();
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 250);
}

function shufflePieces(){
    for(let i=pieces.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        const tmp = pieces[i]; pieces[i]=pieces[j]; pieces[j]=tmp;
    }
}

function updateTimer(){
    const secs = Math.floor((Date.now()-startTime)/1000);
    const m = Math.floor(secs/60), s = secs%60;
    document.getElementById("timeVal").innerText = m+":"+String(s).padStart(2,"0");
}

/* =====================
   DRAG HANDLING (Pointer Events: mouse + touch unified)
===================== */

function onPieceDown(e, piece){
    if(piece.placed) return;
    e.preventDefault();
    initAudio();
    playPickup();

    piece.el.classList.add("dragging");
    try{ piece.el.setPointerCapture(e.pointerId); }catch(err){ /* ignore */ }

    const rect = piece.el.getBoundingClientRect();
    dragState = {
        piece,
        pointerId: e.pointerId,
        offsetX: e.clientX - rect.left,
        offsetY: e.clientY - rect.top
    };

    piece.el.style.zIndex = 999;

    piece.el.onpointermove = (ev)=>{
        if(!dragState) return;
        const x = ev.clientX - dragState.offsetX;
        const y = ev.clientY - dragState.offsetY;
        setPiecePos(dragState.piece, x, y);
    };

    piece.el.onpointerup = (ev)=> onPieceUp(ev, piece);
    piece.el.onpointercancel = (ev)=> onPieceUp(ev, piece);
}

function onPieceUp(ev, piece){
    if(!dragState || dragState.piece!==piece) return;
    try{ piece.el.releasePointerCapture(dragState.pointerId); }catch(err){ /* ignore */ }
    piece.el.classList.remove("dragging");
    piece.el.onpointermove = null;
    piece.el.onpointerup = null;
    piece.el.onpointercancel = null;
    dragState = null;
    moves++;
    document.getElementById("movesVal").innerText = moves;

    // check against correct slot position
    const targetX = boardRect.x + piece.col*pieceW;
    const targetY = boardRect.y + piece.row*pieceH;
    const dist = Math.hypot(piece.x-targetX, piece.y-targetY);
    const threshold = Math.min(pieceW, pieceH) * 0.42;

    if(dist < threshold){
        piece.placed = true;
        piece.el.classList.add("placed");
        piece.el.style.zIndex = 5;
        setPiecePos(piece, targetX, targetY);
        placedCount++;
        document.getElementById("placedVal").innerText = placedCount+"/"+pieces.length;
        playCorrect();
        layoutTray();

        if(placedCount >= pieces.length){
            onPuzzleComplete();
        }
    } else {
        piece.el.style.zIndex = 10;
        playWrongDrop();
        layoutTray();
    }
}

/* =====================
   WIN
===================== */

function onPuzzleComplete(){
    clearInterval(timerInterval);
    playVictory();
    spawnConfettiBurst();

    const secs = Math.floor((Date.now()-startTime)/1000);
    const m = Math.floor(secs/60), s = secs%60;
    const timeStr = m+":"+String(s).padStart(2,"0");

    const bestKey = STORAGE_KEY + "_" + targetPieces;
    const prevBestSecs = parseBestSeconds(localStorage.getItem(bestKey));
    let bestStr = localStorage.getItem(bestKey);
    if(prevBestSecs===null || secs < prevBestSecs){
        localStorage.setItem(bestKey, timeStr);
        bestStr = timeStr + " (new best!)";
    }

    document.getElementById("finalTime").innerText = timeStr;
    document.getElementById("finalMoves").innerText = moves;
    document.getElementById("finalBest").innerText = bestStr || "—";

    setTimeout(()=>{
        document.getElementById("winOverlay").classList.add("show");
    }, 500);
}

function parseBestSeconds(str){
    if(!str) return null;
    const clean = str.split(" ")[0];
    const parts = clean.split(":");
    if(parts.length!==2) return null;
    return parseInt(parts[0],10)*60 + parseInt(parts[1],10);
}

/* =====================
   CONFETTI
===================== */

const confettiCanvas = document.getElementById("confetti");
const cctx = confettiCanvas.getContext("2d");
let confettiParticles = [];
const CONFETTI_COLORS = ["#00e08c", "#ffd24a", "#ffffff", "#7fd8ff", "#00ff8c"];

function resizeConfetti(){
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
}
resizeConfetti();
window.addEventListener("resize", resizeConfetti);

function spawnConfettiBurst(){
    for(let i=0;i<160;i++){
        confettiParticles.push({
            x: window.innerWidth/2 + (Math.random()-0.5)*200,
            y: window.innerHeight*0.3,
            vx: (Math.random()-0.5)*6,
            vy: -Math.random()*6 - 2,
            size: 3+Math.random()*4,
            spin: Math.random()*Math.PI*2,
            spinSpeed: (Math.random()-0.5)*0.3,
            color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
            life: 1
        });
    }
}

function confettiLoop(){
    cctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    for(let i=confettiParticles.length-1;i>=0;i--){
        const p = confettiParticles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.spin += p.spinSpeed;
        p.life -= 0.006;
        if(p.life<=0 || p.y>confettiCanvas.height+30){ confettiParticles.splice(i,1); continue; }
        cctx.save();
        cctx.globalAlpha = Math.max(0,p.life);
        cctx.translate(p.x,p.y);
        cctx.rotate(p.spin);
        cctx.fillStyle = p.color;
        cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
        cctx.restore();
    }
    requestAnimationFrame(confettiLoop);
}
requestAnimationFrame(confettiLoop);
