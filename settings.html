<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<title>Settings - Perodua Puzzle Game</title>
<style>

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }

html, body{
    margin:0; padding:0;
    font-family:Arial, sans-serif;
    -webkit-user-select:none; user-select:none;
    background:#1f5c1a;
    color:#f3ead0;
}

#banner{
    width:100%;
    height:min(30vh, 240px);
    background:url(theme_banner.jpg) center 30%/cover no-repeat;
    position:relative;
    box-shadow:0 6px 20px rgba(0,0,0,0.45);
}
#banner::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.05), rgba(10,20,8,0.75));
}
#bannerTitle{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
}
#bannerTitle h1{
    margin:0;
    font-size:clamp(22px,4vw,40px);
    font-weight:900;
    color:#f0d878;
    text-shadow:3px 3px 0 #2a1c10, 0 0 20px rgba(0,0,0,0.6);
    letter-spacing:1px;
}

#body{
    padding:36px 20px 60px 20px;
    display:flex; flex-direction:column; align-items:center;
    background:
        radial-gradient(circle at 85% 10%, rgba(240,216,120,0.08) 0%, transparent 40%),
        linear-gradient(180deg, #2a6b22 0%, #1c4a17 55%, #123310 100%);
}

#panel{
    background:linear-gradient(180deg, #6b4a2e, #3a2414);
    border:4px solid #2a1c10;
    border-radius:14px;
    padding:26px 30px;
    max-width:480px;
    width:100%;
    box-shadow:0 8px 24px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.12);
}

.settingRow{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 4px;
    border-bottom:1px solid rgba(255,255,255,0.12);
}
.settingRow:last-of-type{ border-bottom:none; }

.settingLabel{ font-size:15px; font-weight:800; }
.settingSub{ font-size:11.5px; color:#e0c98a; margin-top:2px; }

.toggle{
    width:64px; height:34px;
    border-radius:20px;
    background:#2a1c10;
    border:2px solid #1c130a;
    position:relative;
    cursor:pointer;
    touch-action:none;
    flex-shrink:0;
}
.toggle .knob{
    position:absolute; top:2px; left:2px;
    width:26px; height:26px;
    border-radius:50%;
    background:#8a8a8a;
    transition:left 0.15s ease, background 0.15s ease;
}
.toggle.on{ background:#3a7a3a; }
.toggle.on .knob{ left:32px; background:#f0d878; }

.actionBtn{
    margin-top:10px;
    width:100%;
    height:52px;
    border:3px solid #2a1c10;
    border-radius:10px;
    background:linear-gradient(180deg,#c85c5c,#a83a3a);
    color:#f3ead0;
    font-size:15px; font-weight:900;
    cursor:pointer;
    box-shadow:0 4px 0 #4a1c1c;
    touch-action:none;
}
.actionBtn:active{ transform:translateY(3px); box-shadow:none; }

#resetConfirm{
    font-size:12px; color:#ffd8d8; margin-top:8px; text-align:center; min-height:16px;
}

#backBtn{
    margin-top:28px;
    width:220px; height:58px;
    border:4px solid #2a1c10;
    border-radius:10px;
    background:linear-gradient(180deg,#5c86b8,#3a5f8a);
    color:#f3ead0;
    font-size:17px; font-weight:900;
    cursor:pointer;
    box-shadow:0 4px 0 #1c2c3f, inset 0 2px 0 rgba(255,255,255,0.15);
    touch-action:none;
}
#backBtn:active{ transform:translateY(3px); box-shadow:inset 0 2px 0 rgba(255,255,255,0.15); }

</style>
</head>
<body>

<div id="banner">
    <div id="bannerTitle"><h1>⚙ SETTINGS</h1></div>
</div>

<div id="body">
    <div id="panel">
        <div class="settingRow">
            <div>
                <div class="settingLabel">Background Sound</div>
                <div class="settingSub">Music &amp; effects across all puzzles</div>
            </div>
            <div class="toggle on" id="soundToggle"><div class="knob"></div></div>
        </div>

        <div class="settingRow" style="border-bottom:none; flex-direction:column; align-items:stretch; gap:8px;">
            <div>
                <div class="settingLabel">Best Times</div>
                <div class="settingSub">Clears saved best times for every puzzle &amp; difficulty</div>
            </div>
            <button class="actionBtn" id="resetBtn">RESET ALL BEST TIMES</button>
            <div id="resetConfirm"></div>
        </div>
    </div>

    <button id="backBtn">← BACK TO MENU</button>
</div>

<script>
document.addEventListener("contextmenu", e=>e.preventDefault());

const soundToggle = document.getElementById("soundToggle");

function loadSoundSetting(){
    const muted = localStorage.getItem("perodua_muted") === "true";
    soundToggle.classList.toggle("on", !muted);
}
loadSoundSetting();

soundToggle.addEventListener("click", ()=>{
    const isOn = soundToggle.classList.toggle("on");
    localStorage.setItem("perodua_muted", isOn ? "false" : "true");
});

document.getElementById("resetBtn").addEventListener("click", ()=>{
    const keys = Object.keys(localStorage).filter(k => k.startsWith("puzzleBest_"));
    keys.forEach(k => localStorage.removeItem(k));
    const msg = document.getElementById("resetConfirm");
    msg.innerText = keys.length ? ("Cleared " + keys.length + " saved best time(s).") : "No saved best times to clear.";
    setTimeout(()=>{ msg.innerText = ""; }, 3000);
});

document.getElementById("backBtn").addEventListener("click", ()=>{
    window.location.href = "index.html";
});
</script>

</body>
</html>
